<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Register</title>
    <meta charset = "utf-8">
    <link rel="stylesheet" href="./website/styles.css">
  </head>
  <body>
    <div class="navbar">

      <a href="index.html">Home</a>
      <a href="register.html">[ Register ]</a> 
      <a href="login.html">Login</a> 
      <a href="scoreboard.html">Scoreboard</a> 
    </div>
    <div class="registerSection">
      <form id="registerForm">
        <h2>Register</h2>
        <div>
          <span class="icon"><ion-icon name="person-sharp"></ion-icon></span>
          <input type = "text" id = "usernameRegister"  placeHolder = "Username">
        </div>
        <div>
          <span class="icon"><ion-icon name="lock-closed-sharp"></ion-icon></span>
          <input type = "password" id = "passwordRegister"  placeHolder = "Password">
        </div>
        <div>
          <span class="icon"><ion-icon name="call"></ion-icon></span>
          <input type = "text" id = "phoneRegister"  placeHolder = "Telephone Number">
        </div>
        <div>
          <span class="icon"><ion-icon name="business"></ion-icon></span>
          <input type = "text" id = "addressRegister"  placeHolder = "Address">
        </div>
        <button id = "registerButton">Register</button>
        <div class="login-redirect">
          <a>Already have an account? <a href="login.html">Login HERE!</a></a>
        </div>
          <a id = "registerMessage"></a>
      </form>
    </div>  



    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src = "./website/register.js"></script>
  </body>
</html>
