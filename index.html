<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Homepage</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./website/styles.css">
    <style>
      /* Simple home-page specific style */
      body {
        font-family: Arial, sans-serif;
        background-color: lightblue;
        color: #fff;
        margin: 0;
        text-align: center;
      }

      .content {
        margin-top: 120px;
        padding: 20px;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        color: #00bcd4;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
      }

      a {
        color: #00bcd4;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      #buttonLogout {
        background-color: #00bcd4;
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 1rem;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      #buttonLogout:hover {
        background-color: #0097a7;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <a href="index.html">[ Home ]</a>
      <a href="game.html" id="gameHref" style="display: none">Game</a> 
      <a href="register.html" id="registerHref">Register</a> 
      <a href="login.html" id="loginHref">Login</a> 
      <a href="scoreboard.html">Scoreboard</a> 
    </div>
    
    <div class="content">
      <h1 id="welcomeMessage">Welcome!</h1>
      <button id="buttonLogout" class="hidden" style="display: none;">Logout</button>
      <input class="hidden" type="radio" id="radioHTML" value="HTML">
      <label id = "radioLabel" class="hidden" style="display: none" for="radioHtml">Clear Local Storage?</label>
    </div>
    <script>
      var getUser = localStorage.getItem("loggedUser");
      if(getUser == null){
        document.getElementById("welcomeMessage").innerHTML = `You are not logged in. Please <a href="login.html">Login HERE!</a>`;
      }
      else{
        document.getElementById("welcomeMessage").innerHTML = `Welcome ${JSON.parse(getUser).username}`;
        document.getElementById("registerHref").style.display = "none";
        document.getElementById("loginHref").style.display = "none";
        document.getElementById("buttonLogout").style.display = "inline";
        document.getElementById("radioHTML").style.display = "inline";
        document.getElementById("gameHref").style.display = "inline";
        document.getElementById("radioLabel").style.display = "inline";
      }
      document.getElementById("buttonLogout").addEventListener("click", ()=>{
        localStorage.removeItem("loggedUser");
        localStorage.removeItem("best-score");
        localStorage.removeItem("session-score");
        document.getElementById("registerHref").style.display = "inline";
        document.getElementById("loginHref").style.display = "inline";
        document.getElementById("welcomeMessage").innerHTML = `You are not logged in. Please <a href="login.html">Login HERE!</a>`;
        document.getElementById("buttonLogout").style.display = "none";
        document.getElementById("gameHref").style.display =  "none";
        if(document.getElementById("radioHTML").checked){
          window.addEventListener("beforeunload", function () {
            localStorage.removeItem("users");
          });
        }

      });
      </script>
  </body>
</html>
